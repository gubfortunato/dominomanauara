# Diagnóstico privado: o resultado sai criptografado (só quem tem a chave privada lê). Nada de dado pessoal no log.
name: diagnostico
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c5f546c10d461c0d2e3e1d54f83fba39' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar
        working-directory: servidor
        shell: bash
        run: |
          set +e
          OUT=/tmp/priv.txt; : > $OUT
          npm i -g wrangler@4 > /dev/null 2>&1
          id=$(wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="dominomanauara") | .uuid')
          sed -e "s/__D1_ID__/$id/" -e "s/__VERSAO__/diag/" wrangler.template.toml > wrangler.toml
          AGORA=$(($(date +%s) * 1000))
          p() { echo "== $1" >> $OUT; wrangler d1 execute dominomanauara --remote --json --command "$2" 2>/dev/null | jq -c '.[0].results' >> $OUT 2>/dev/null; }
          # 11/11 (pergunta do dono): tamanho das Turmas — só contagens (nenhum código, nenhum nome de Turma ou de pessoa)
          TM="(SELECT t.codigo, (SELECT COUNT(*) FROM turma_membros m WHERE m.turma = t.codigo) AS membros FROM turmas t)"
          p tamanhos "SELECT membros, COUNT(*) AS turmas FROM $TM GROUP BY membros ORDER BY membros"
          p desafio_por_tamanho "SELECT x.membros, COUNT(*) AS turmas_com_ponto, SUM(p.pontos) AS pontos FROM desafio_pontos p JOIN $TM x ON x.codigo = p.turma WHERE p.edicao = 2026 AND p.pontos > 0 GROUP BY x.membros ORDER BY x.membros"
          p top10 "SELECT x.membros, p.pontos FROM desafio_pontos p JOIN $TM x ON x.codigo = p.turma WHERE p.edicao = 2026 AND p.pontos > 0 ORDER BY p.pontos DESC, p.ultimo ASC LIMIT 10"
          p solo_socio "SELECT COUNT(*) AS turmas_de_1, SUM(CASE WHEN EXISTS (SELECT 1 FROM planos pl WHERE pl.aparelho = m.aparelho AND pl.ate > $AGORA) THEN 1 ELSE 0 END) AS dono_socio FROM turma_membros m WHERE m.turma IN (SELECT codigo FROM $TM WHERE membros = 1)"
          p solo_idade "SELECT COUNT(*) AS turmas_de_1, SUM(CASE WHEN t.criada > $AGORA - 7*86400000 THEN 1 ELSE 0 END) AS criadas_7_dias FROM turmas t WHERE t.codigo IN (SELECT codigo FROM $TM WHERE membros = 1)"
          rm -f wrangler.toml
          cat > /tmp/cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIID/zCCAmegAwIBAgIUQME67vF2YCFx4qbuKp7jtL5uF+AwDQYJKoZIhvcNAQEL
          BQAwDzENMAsGA1UEAwwEZGlhZzAeFw0yNjExMTAxMTIxNDNaFw0yNjEyMTAxMTIx
          NDNaMA8xDTALBgNVBAMMBGRpYWcwggGiMA0GCSqGSIb3DQEBAQUAA4IBjwAwggGK
          AoIBgQCh+a3g8dvenYXkbxbqSEWpc2kIa8M3/sWAEildJeaX+xKJKJEDjkHliJNk
          RLokpedKL8Gm34Q/liKO3cGNZ603gkCzfwoI44FFfhUf5WZtw3vy9WA3T8y+t/Ac
          I+GdzEIL4HCKT7zKB+JAU2DtdLBFTlgJVAuGC0Aw3sfST7VriMYgNpdFRQ63175P
          5zcvwic3Gi7Wz3v3i0Sje3/j/LDtUR3UakrGw6wNOUTzoNd9WjYxJJ7My1DBSMyq
          /GpeOfKzqf15fzS42kDgnPpqxh//Q/01yKZ6IU8Ff2l4HLzUpjl44ysIMc4Xn2S3
          PCRDsbOt37OK1N6OkBM1NjqH/eQTpwllSr6uuvP9XMIMNdEgZtG/DfluHqp941zJ
