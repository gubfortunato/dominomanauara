# Diagnóstico privado: o resultado sai criptografado (só quem tem a chave privada lê). Nada de dado pessoal no log.
name: diagnostico
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c5f546c10d461c0d2e3e1d54f83fba39' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar
        working-directory: servidor
        shell: bash
        run: |
          set +e
          OUT=/tmp/priv.txt; : > $OUT
          npm i -g wrangler@4 > /dev/null 2>&1
          id=$(wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="dominomanauara") | .uuid')
          sed -e "s/__D1_ID__/$id/" -e "s/__VERSAO__/diag/" wrangler.template.toml > wrangler.toml
          AGORA=$(($(date +%s) * 1000))
          p() { echo "== $1" >> $OUT; wrangler d1 execute dominomanauara --remote --json --command "$2" 2>/dev/null | jq -c '.[0].results' >> $OUT 2>/dev/null; }
          # 10/11 (pedido do dono): devolve a derrota por saída de quem foi pego pelo erro da publicação das 22:50 (Manaus).
          # Quem teve saída anotada entre 22:48 e 22:56: +1 ponto por saída e -1 partida no ranking da semana e do mês, e a
          # anotação de saída de hoje é apagada. Aqui só aparecem contagens (nenhum código de aparelho, nenhum apelido).
          ALVO="SELECT aparelho FROM abandonos WHERE dia = '2026-11-10' AND ultimo BETWEEN 1794365280000 AND 1794365760000"
          NA="(SELECT n FROM abandonos a WHERE a.dia = '2026-11-10' AND a.aparelho"
          p antes "SELECT COUNT(*) AS aparelhos, SUM(n) AS saidas FROM abandonos WHERE dia = '2026-11-10' AND ultimo BETWEEN 1794365280000 AND 1794365760000"
          p calcada "UPDATE calcada SET pontos = pontos + $NA = calcada.aparelho), jogadas = MAX(0, jogadas - $NA = calcada.aparelho)), jogadas_gente = MAX(0, jogadas_gente - $NA = calcada.aparelho)) WHERE periodo IN ('S2026-11-09', 'M2026-11') AND aparelho IN ($ALVO) RETURNING periodo"
          p ranking "UPDATE ranking SET jogadas = MAX(ganhas, jogadas - $NA = ranking.aparelho)) WHERE periodo IN ('S2026-11-09', 'M2026-11') AND aparelho IN ($ALVO) RETURNING periodo"
          p apagou "DELETE FROM abandonos WHERE dia = '2026-11-10' AND ultimo BETWEEN 1794365280000 AND 1794365760000 RETURNING n"
          rm -f wrangler.toml
          cat > /tmp/cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIID/zCCAmegAwIBAgIUQME67vF2YCFx4qbuKp7jtL5uF+AwDQYJKoZIhvcNAQEL
