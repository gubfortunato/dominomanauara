# Diagnóstico privado: o resultado sai criptografado (só quem tem a chave privada lê). Nada de dado pessoal no log.
name: diagnostico
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c5f546c10d461c0d2e3e1d54f83fba39' }}
      ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar
        working-directory: servidor
        shell: bash
        run: |
          set +e
          OUT=/tmp/priv.txt; : > $OUT
          npm i -g wrangler@4 > /dev/null 2>&1
          id=$(wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="dominomanauara") | .uuid')
          sed -e "s/__D1_ID__/$id/" -e "s/__VERSAO__/diag/" wrangler.template.toml > wrangler.toml
          AGORA=$(($(date +%s) * 1000))
          p() { echo "== $1" >> $OUT; wrangler d1 execute dominomanauara --remote --json --command "$2" 2>/dev/null | jq -c '.[0].results' >> $OUT 2>/dev/null; }
          # 13/11: sugestão de resposta da IA com mensagens inventadas (o mesmo pedido do servidor, do rascunho). Só lê.
          git fetch -q origin rascunho-3.45.1 && mkdir -p /tmp/srv && git --work-tree=/tmp/srv checkout origin/rascunho-3.45.1 -- servidor/src && echo '{"type":"module"}' > /tmp/srv/servidor/src/package.json
          node "$GITHUB_WORKSPACE/.github/diag/ia_teste.mjs" $OUT /tmp/srv/servidor/src 2>> /tmp/err.txt || echo "falhou: $(tail -c 300 /tmp/err.txt)" >> $OUT
          rm -f wrangler.toml
          cat > /tmp/cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIID/zCCAmegAwIBAgIUQME67vF2YCFx4qbuKp7jtL5uF+AwDQYJKoZIhvcNAQEL
