# Diagnóstico privado: o resultado sai criptografado (só quem tem a chave privada lê). Nada de dado pessoal no log.
name: diagnostico
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c5f546c10d461c0d2e3e1d54f83fba39' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar
        working-directory: servidor
        shell: bash
        run: |
          set +e
          OUT=/tmp/priv.txt; : > $OUT
          npm i -g wrangler@4 > /dev/null 2>&1
          id=$(wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="dominomanauara") | .uuid')
          sed -e "s/__D1_ID__/$id/" -e "s/__VERSAO__/diag/" wrangler.template.toml > wrangler.toml
          AGORA=$(($(date +%s) * 1000)); D=86400000
          p() { echo "== $1" >> $OUT; wrangler d1 execute dominomanauara --remote --json --command "$2" 2>/dev/null | jq -c '.[0].results' >> $OUT 2>/dev/null; }
          NOME="COALESCE((SELECT nome FROM presenca x WHERE x.aparelho = T.aparelho AND x.nome IS NOT NULL), (SELECT nome FROM jogadores_vistos x WHERE x.aparelho = T.aparelho), (SELECT nome FROM ranking x WHERE x.aparelho = T.aparelho ORDER BY atualizado DESC LIMIT 1))"
          DESDE=$(( $(date -u -d '2026-10-10T00:00:00Z' +%s) * 1000 ))
          p vistos "SELECT aparelho, nome, av, mesa, visto_em FROM jogadores_vistos"
          p presenca "SELECT aparelho, nome, av, tela, modo, detalhe, visto_em FROM presenca WHERE nome IS NOT NULL"
          p ranking "SELECT aparelho, nome, av, MAX(atualizado) AS em, SUM(jogadas) AS jogadas FROM ranking GROUP BY aparelho"
          p turma_membros "SELECT * FROM turma_membros"
          p turmas "SELECT * FROM turmas"
          p aparelhos "SELECT aparelho, desde FROM aparelhos WHERE desde >= $DESDE"
          p jogadores "SELECT aparelho, primeiro, ultimo, partidas, maos FROM jogadores WHERE ultimo >= $DESDE"
          p planos "SELECT aparelho, ate, desde FROM planos"
          p pedidos "SELECT aparelho, produto, valor, status, criado_em, pago_em FROM pedidos"
          p cortesias "SELECT * FROM cortesias"
          p bloqueios "SELECT * FROM bloqueios"
          p apelidos_trocar "SELECT * FROM apelidos_trocar"
          p ritmo "SELECT * FROM ritmo"
          p limites_rede "SELECT * FROM limites_rede"
          p tentativas "SELECT marca, tipo, COUNT(*) AS n, MIN(criado_em) AS de, MAX(criado_em) AS ate FROM tentativas GROUP BY marca, tipo"
          p mesas_criadas "SELECT marca, COUNT(*) AS n, MIN(criado_em) AS de, MAX(criado_em) AS ate FROM mesas_criadas GROUP BY marca"
          p pares "SELECT * FROM calcada_par WHERE dia >= '2026-10-25'"
          p robo "SELECT * FROM calcada_robo WHERE dia >= '2026-10-25'"
          p calcada "SELECT periodo, aparelho, nome, pontos, ganhas, jogadas, ganhas_gente, jogadas_gente FROM calcada WHERE periodo >= 'S2026'"
          p fotos "SELECT aparelho, status, criado_em, denuncias FROM fotos"
          p papo_denuncias "SELECT * FROM papo_denuncias ORDER BY em DESC LIMIT 80"
          p mensagens "SELECT id, criado_em, tipo, nome, contato, versao, aparelho, substr(texto,1,400) AS texto FROM mensagens ORDER BY criado_em DESC LIMIT 150"
          p acessos "SELECT dia, aparelho, COUNT(*) AS horas FROM acessos_hora GROUP BY dia, aparelho"
          p partidas_dia "SELECT * FROM partidas_dia"
          rm -f wrangler.toml
          cat > /tmp/cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIID/zCCAmegAwIBAgIUQME67vF2YCFx4qbuKp7jtL5uF+AwDQYJKoZIhvcNAQEL
