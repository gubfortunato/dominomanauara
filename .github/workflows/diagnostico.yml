# Diagnóstico privado: o resultado sai criptografado (só quem tem a chave privada lê). Nada de dado pessoal no log.
name: diagnostico
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c5f546c10d461c0d2e3e1d54f83fba39' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar
        working-directory: servidor
        shell: bash
        run: |
          set +e
          OUT=/tmp/priv.txt; : > $OUT
          npm i -g wrangler@4 > /dev/null 2>&1
          id=$(wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="dominomanauara") | .uuid')
          sed -e "s/__D1_ID__/$id/" -e "s/__VERSAO__/diag/" wrangler.template.toml > wrangler.toml
          AGORA=$(($(date +%s) * 1000))
          p() { echo "== $1" >> $OUT; wrangler d1 execute dominomanauara --remote --json --command "$2" 2>/dev/null | jq -c '.[0].results' >> $OUT 2>/dev/null; }
          # 10/11 (pedido do dono): números dos limites e da conversão (só contagens, nada de código de aparelho nem apelido)
          # e o efeito do erro da publicação das 22:50 (abandonos de hoje, só os horários).
          DEZ="date('now','-10 day')"
          p limites_dia "SELECT dia, COUNT(*) AS jogaram_online, SUM(publicas >= 1) AS rapida_jogou, SUM(publicas >= 3) AS rapida_bateu3, SUM(publicas >= 5) AS rapida_bateu5, SUM(partidas >= 1) AS amigos_1, SUM(partidas >= 2) AS amigos_2, SUM(mesas >= 1) AS criou_mesa FROM limites WHERE dia >= $DEZ GROUP BY dia ORDER BY dia"
          p offline_dia "SELECT dia, COUNT(*) AS jogaram, SUM(n >= 5) AS bateram5, ROUND(AVG(n), 1) AS media FROM offline_uso WHERE dia >= $DEZ GROUP BY dia ORDER BY dia"
          p desafio_dia "SELECT dia, COUNT(*) AS jogaram, SUM(n >= 2) AS bateram2 FROM desafio_uso WHERE dia >= $DEZ GROUP BY dia ORDER BY dia"
          LIM="SELECT aparelho, dia FROM limites WHERE publicas >= 3 OR partidas >= 1 UNION SELECT aparelho, dia FROM offline_uso WHERE n >= 5 UNION SELECT aparelho, dia FROM desafio_uso WHERE n >= 2"
          p conversao "WITH lim AS (SELECT aparelho, MIN(dia) AS d FROM ($LIM) GROUP BY aparelho) SELECT COUNT(*) AS bateram_alguma_vez, SUM(EXISTS (SELECT 1 FROM planos p WHERE p.aparelho = lim.aparelho AND p.ate > $AGORA)) AS socios_hoje, SUM(EXISTS (SELECT 1 FROM planos p WHERE p.aparelho = lim.aparelho AND p.desde > (strftime('%s', lim.d) * 1000))) AS viraram_socio_depois FROM lim"
          p voltaram "WITH lim AS ($LIM), ativ AS (SELECT aparelho, dia FROM limites UNION SELECT aparelho, dia FROM offline_uso UNION SELECT aparelho, dia FROM desafio_uso) SELECT lim.dia, COUNT(*) AS bateram, SUM(EXISTS (SELECT 1 FROM ativ a WHERE a.aparelho = lim.aparelho AND a.dia = date(lim.dia, '+1 day'))) AS voltaram_no_dia_seguinte FROM lim WHERE lim.dia >= $DEZ GROUP BY lim.dia ORDER BY lim.dia"
          p socios "SELECT COUNT(*) AS ativos, SUM(desde > $AGORA - 7*86400000) AS entraram_7d FROM planos WHERE ate > $AGORA"
          p socios_dia "SELECT date((desde - 14400000) / 1000, 'unixepoch') AS dia, COUNT(*) AS novos FROM planos WHERE desde > $AGORA - 15*86400000 GROUP BY dia ORDER BY dia"
          p pagos_dia "SELECT date((pago_em - 14400000) / 1000, 'unixepoch') AS dia, produto, COUNT(*) AS n, ROUND(SUM(valor), 2) AS total FROM pedidos WHERE status = 'pago' AND pago_em > $AGORA - 15*86400000 GROUP BY dia, produto ORDER BY dia"
          p novos_aparelhos "SELECT date((primeiro - 14400000) / 1000, 'unixepoch') AS dia, COUNT(*) AS novos FROM jogadores WHERE primeiro > $AGORA - 10*86400000 GROUP BY dia ORDER BY dia"
          p abandonos_hoje "SELECT n, strftime('%H:%M', (ultimo - 14400000) / 1000, 'unixepoch') AS ultimo_manaus FROM abandonos WHERE dia = date(($AGORA - 14400000) / 1000, 'unixepoch') ORDER BY ultimo"
          p na_mesa_agora "SELECT tela, modo, COUNT(*) AS n FROM presenca WHERE visto_em > $AGORA - 300000 GROUP BY tela, modo"
          rm -f wrangler.toml
          cat > /tmp/cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIID/zCCAmegAwIBAgIUQME67vF2YCFx4qbuKp7jtL5uF+AwDQYJKoZIhvcNAQEL
          BQAwDzENMAsGA1UEAwwEZGlhZzAeFw0yNjExMTAxMTIxNDNaFw0yNjEyMTAxMTIx
          NDNaMA8xDTALBgNVBAMMBGRpYWcwggGiMA0GCSqGSIb3DQEBAQUAA4IBjwAwggGK
          AoIBgQCh+a3g8dvenYXkbxbqSEWpc2kIa8M3/sWAEildJeaX+xKJKJEDjkHliJNk
          RLokpedKL8Gm34Q/liKO3cGNZ603gkCzfwoI44FFfhUf5WZtw3vy9WA3T8y+t/Ac
          I+GdzEIL4HCKT7zKB+JAU2DtdLBFTlgJVAuGC0Aw3sfST7VriMYgNpdFRQ63175P
          5zcvwic3Gi7Wz3v3i0Sje3/j/LDtUR3UakrGw6wNOUTzoNd9WjYxJJ7My1DBSMyq
          /GpeOfKzqf15fzS42kDgnPpqxh//Q/01yKZ6IU8Ff2l4HLzUpjl44ysIMc4Xn2S3
          PCRDsbOt37OK1N6OkBM1NjqH/eQTpwllSr6uuvP9XMIMNdEgZtG/DfluHqp941zJ
          xPgMWTTrqfMQ18Nzd0c33CWAZMb7thoGnQuDOqPaBsTENPGXP0xHN+NsgxKVRl/Q
          Lp7qhvGm4tJDjhBywtB0jU5NDLpvtZgnpa0NdlHIZb/vgVOBh1pnGl6NP8DALyF/
          Qp7JhJECAwEAAaNTMFEwHQYDVR0OBBYEFNF4rl7COtkaQ708ieHQ7XqW33gIMB8G
          A1UdIwQYMBaAFNF4rl7COtkaQ708ieHQ7XqW33gIMA8GA1UdEwEB/wQFMAMBAf8w
          DQYJKoZIhvcNAQELBQADggGBAHQa3vjU6BeYLY6b0WP2Vxv/Q83jnLpmkeiobgeE
          /qo8pzZ8jhEo8A3H/khiOZiK7VCcIyqcIFG2vC+3Yhw+tGKeEaGZAfo/29o3hLxD
          5KF+lFSxtkj8ILgj3i51EQ/7YXOLUFsJ2tf0e+zE2Xr4FVVKqQ4dGe1Csdg4XuBh
          oruwNMFqJj6aPT4EXV5TkJLdUD3wjgnlyKNmxcZFzrqkCwhPqKpAIwwZHA5FWgAi
          ywkWWi+sVJW4M+I07nuFYyskSnHyOnLlViAe2WZQdc5oFjVaB/ZSIbvHIa4tCUvP
          tzlALSBZsL2qKclCFJOZrax6IPrakcw6l7qbzVl8ZoHSaqALt6p84eJqbQChv7gu
          wdqKNd6+UINb25CPaNLU+7Ap9tab5W4JlRvaqkMClhq1eiJsxH8FSPGy73thUoAz
