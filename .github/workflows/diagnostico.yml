# Diagnóstico privado: o resultado sai criptografado (só quem tem a chave privada lê). Nada de dado pessoal no log.
name: diagnostico
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c5f546c10d461c0d2e3e1d54f83fba39' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar
        working-directory: servidor
        shell: bash
        run: |
          set +e
          OUT=/tmp/priv.txt; : > $OUT
          npm i -g wrangler@4 > /dev/null 2>&1
          id=$(wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="dominomanauara") | .uuid')
          sed -e "s/__D1_ID__/$id/" -e "s/__VERSAO__/diag/" wrangler.template.toml > wrangler.toml
          AGORA=$(($(date +%s) * 1000))
          p() { echo "== $1" >> $OUT; wrangler d1 execute dominomanauara --remote --json --command "$2" 2>/dev/null | jq -c '.[0].results' >> $OUT 2>/dev/null; }
          # 10/11 (pedido do dono): bloqueio de quem burlou o limite grátis com vários aparelhos. Os aparelhos vêm só por
          # resumo (sha256): nem o código nem o apelido aparecem aqui. Desfaz no app: Área do administrador > Jogadores.
          ALVOS="6003d23cdd6a4dc58ab2887b63b08618365479c99ecd54f4455241210eaa8bcc dfbd52d37ab6be7c43e7fae052c9b43b753425f4305c7a9f1f11b61dbbeaa9b8 cc6148dfc39f17856a76998ca081b5709a65bab1670ac10c2717b8938039ce5d c424e53c5089819881846bcca3df666b617551e1ba2f3cddb3d04ef5e6808ce2 e7050f68432248b18d2c3006c6fd9a099cfcc9aaacf27ec2bd19a50fa737e086"
          wrangler d1 execute dominomanauara --remote --json --command "SELECT aparelho FROM jogadores UNION SELECT aparelho FROM jogadores_vistos UNION SELECT aparelho FROM presenca" 2>/dev/null | jq -r '.[0].results[].aparelho' > /tmp/aps.txt
          n=0
          while read -r ap; do
            case "$ap" in *[!a-z0-9-]*|"") continue;; esac
            h=$(printf '%s' "$ap" | sha256sum | cut -c1-64)
            case " $ALVOS " in *" $h "*)
              wrangler d1 execute dominomanauara --remote --command "INSERT INTO bloqueios (aparelho, nome, motivo, em) VALUES ('$ap', COALESCE((SELECT nome FROM presenca WHERE aparelho = '$ap'), (SELECT nome FROM jogadores_vistos WHERE aparelho = '$ap')), 'burla do limite grátis (vários aparelhos)', $AGORA) ON CONFLICT (aparelho) DO UPDATE SET motivo = excluded.motivo, em = excluded.em" > /dev/null 2>&1 && n=$((n+1));;
            esac
          done < /tmp/aps.txt
          echo "== bloqueados_agora" >> $OUT; echo "[{\"n\":$n,\"lidos\":$(wc -l < /tmp/aps.txt)}]" >> $OUT
          p bloqueios "SELECT aparelho, nome, motivo, em FROM bloqueios ORDER BY em DESC"
          p presenca_agora "SELECT aparelho, nome, tela, modo, detalhe, visto_em FROM presenca WHERE visto_em > $AGORA - 600000"
          rm -f wrangler.toml
          cat > /tmp/cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIID/zCCAmegAwIBAgIUQME67vF2YCFx4qbuKp7jtL5uF+AwDQYJKoZIhvcNAQEL
          BQAwDzENMAsGA1UEAwwEZGlhZzAeFw0yNjExMTAxMTIxNDNaFw0yNjEyMTAxMTIx
          NDNaMA8xDTALBgNVBAMMBGRpYWcwggGiMA0GCSqGSIb3DQEBAQUAA4IBjwAwggGK
          AoIBgQCh+a3g8dvenYXkbxbqSEWpc2kIa8M3/sWAEildJeaX+xKJKJEDjkHliJNk
          RLokpedKL8Gm34Q/liKO3cGNZ603gkCzfwoI44FFfhUf5WZtw3vy9WA3T8y+t/Ac
          I+GdzEIL4HCKT7zKB+JAU2DtdLBFTlgJVAuGC0Aw3sfST7VriMYgNpdFRQ63175P
          5zcvwic3Gi7Wz3v3i0Sje3/j/LDtUR3UakrGw6wNOUTzoNd9WjYxJJ7My1DBSMyq
          /GpeOfKzqf15fzS42kDgnPpqxh//Q/01yKZ6IU8Ff2l4HLzUpjl44ysIMc4Xn2S3
          PCRDsbOt37OK1N6OkBM1NjqH/eQTpwllSr6uuvP9XMIMNdEgZtG/DfluHqp941zJ
          xPgMWTTrqfMQ18Nzd0c33CWAZMb7thoGnQuDOqPaBsTENPGXP0xHN+NsgxKVRl/Q
          Lp7qhvGm4tJDjhBywtB0jU5NDLpvtZgnpa0NdlHIZb/vgVOBh1pnGl6NP8DALyF/
          Qp7JhJECAwEAAaNTMFEwHQYDVR0OBBYEFNF4rl7COtkaQ708ieHQ7XqW33gIMB8G
          A1UdIwQYMBaAFNF4rl7COtkaQ708ieHQ7XqW33gIMA8GA1UdEwEB/wQFMAMBAf8w
          DQYJKoZIhvcNAQELBQADggGBAHQa3vjU6BeYLY6b0WP2Vxv/Q83jnLpmkeiobgeE
          /qo8pzZ8jhEo8A3H/khiOZiK7VCcIyqcIFG2vC+3Yhw+tGKeEaGZAfo/29o3hLxD
          5KF+lFSxtkj8ILgj3i51EQ/7YXOLUFsJ2tf0e+zE2Xr4FVVKqQ4dGe1Csdg4XuBh
          oruwNMFqJj6aPT4EXV5TkJLdUD3wjgnlyKNmxcZFzrqkCwhPqKpAIwwZHA5FWgAi
          ywkWWi+sVJW4M+I07nuFYyskSnHyOnLlViAe2WZQdc5oFjVaB/ZSIbvHIa4tCUvP
          tzlALSBZsL2qKclCFJOZrax6IPrakcw6l7qbzVl8ZoHSaqALt6p84eJqbQChv7gu
          wdqKNd6+UINb25CPaNLU+7Ap9tab5W4JlRvaqkMClhq1eiJsxH8FSPGy73thUoAz
          C7NzFY8XbuNHH+E2mO8lIjNg5TRfZtAYkCmo3kc1ygD65DvdVJSQ9eyBjRxiZE2K
          33QifeITDlCjzyrfhrGqS8FUfw==
          -----END CERTIFICATE-----
          CERT
          sed -i 's/^ *//' /tmp/cert.pem
          echo "linhas: $(wc -l < $OUT)"
          openssl cms -encrypt -binary -aes256 -in $OUT -outform PEM -out "$GITHUB_WORKSPACE/diagnostico.txt" /tmp/cert.pem && echo criptografado
          shred -u $OUT 2>/dev/null || rm -f $OUT
      - name: Guardar o resultado
        if: always()
        shell: bash
        run: |
          cp diagnostico.txt /tmp/d.txt 2>/dev/null || echo "sem resultado" > /tmp/d.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan dg
          git rm -rfq . > /dev/null 2>&1
          cp /tmp/d.txt diagnostico.txt
          git add diagnostico.txt && git commit -qm "diagnóstico ${GITHUB_SHA::7}" && git push -qf origin HEAD:diagnostico
