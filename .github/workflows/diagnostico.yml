          sed -i 's/^ *//' /tmp/cert.pem
          echo "linhas: $(wc -l < $OUT)"
          openssl cms -encrypt -binary -aes256 -in $OUT -outform PEM -out "$GITHUB_WORKSPACE/diagnostico.txt" /tmp/cert.pem && echo criptografado
          shred -u $OUT 2>/dev/null || rm -f $OUT
      - name: Guardar o resultado
        if: always()
        shell: bash
        run: |
          cp diagnostico.txt /tmp/d.txt 2>/dev/null || echo "sem resultado" > /tmp/d.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan dg
          git rm -rfq . > /dev/null 2>&1
          cp /tmp/d.txt diagnostico.txt
          git add diagnostico.txt && git commit -qm "diagnóstico ${GITHUB_SHA::7}" && git push -qf origin HEAD:diagnostico
