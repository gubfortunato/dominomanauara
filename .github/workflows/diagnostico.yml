# Diagnóstico privado: o resultado sai criptografado (só quem tem a chave privada lê). Nada de dado pessoal no log.
name: diagnostico
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c5f546c10d461c0d2e3e1d54f83fba39' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar
        working-directory: servidor
        shell: bash
        run: |
          set +e
          OUT=/tmp/priv.txt; : > $OUT
          npm i -g wrangler@4 > /dev/null 2>&1
          id=$(wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="dominomanauara") | .uuid')
          sed -e "s/__D1_ID__/$id/" -e "s/__VERSAO__/diag/" wrangler.template.toml > wrangler.toml
          AGORA=$(($(date +%s) * 1000))
          p() { echo "== $1" >> $OUT; wrangler d1 execute dominomanauara --remote --json --command "$2" 2>/dev/null | jq -c '.[0].results' >> $OUT 2>/dev/null; }
          # visão geral de cada aparelho (sem filtrar por apelido aqui: o filtro é feito depois, no resultado criptografado)
          p vistos "SELECT * FROM jogadores_vistos"
          p presenca "SELECT * FROM presenca"
          p jogadores "SELECT * FROM jogadores"
          p calcada "SELECT * FROM calcada WHERE periodo LIKE 'S2026-1%' OR periodo LIKE 'M2026-1%'"
          p planos "SELECT * FROM planos"
          p pedidos "SELECT aparelho, produto, valor, status, criado_em, pago_em FROM pedidos"
          p cortesias "SELECT * FROM cortesias"
          p presentes "SELECT * FROM presentes"
          p burlas "SELECT * FROM burlas"
          p limites "SELECT * FROM limites"
          p limites_rede "SELECT * FROM limites_rede"
          p partidas_dia "SELECT * FROM partidas_dia WHERE dia >= '2026-11-01'"
          p offline_uso "SELECT * FROM offline_uso"
          p desafio_uso "SELECT * FROM desafio_uso"
          p denuncias "SELECT id, em, mesa, autor, autor_nome, denunciante, texto FROM papo_denuncias"
          p bloqueios "SELECT * FROM bloqueios"
          p turma_membros "SELECT * FROM turma_membros"
          p turmas "SELECT * FROM turmas"
          p apelidos_trocar "SELECT * FROM apelidos_trocar"
          p ranking_fora "SELECT * FROM ranking_fora"
          p mesas_criadas "SELECT * FROM mesas_criadas"
          p avisos_id "SELECT * FROM avisos_id"
          p progresso "SELECT * FROM progresso"
          rm -f wrangler.toml
          cat > /tmp/cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIID/zCCAmegAwIBAgIUQME67vF2YCFx4qbuKp7jtL5uF+AwDQYJKoZIhvcNAQEL
          BQAwDzENMAsGA1UEAwwEZGlhZzAeFw0yNjExMTAxMTIxNDNaFw0yNjEyMTAxMTIx
