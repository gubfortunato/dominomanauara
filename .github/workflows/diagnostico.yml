# Diagnóstico de robôs de fora (pedido do dono): só números agregados, sem apelido nem código de ninguém.
# Roda à mão (Actions › diagnostico › Run workflow) e grava o resultado no ramo "diagnostico" (diagnostico.txt).
name: diagnostico
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c5f546c10d461c0d2e3e1d54f83fba39' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar
        working-directory: servidor
        shell: bash
        run: |
          set +e
          ST="$GITHUB_WORKSPACE/diagnostico.txt"; : > "$ST"
          log() { echo "$*" | tee -a "$ST"; }
          npm i -g wrangler@4 > /dev/null 2>&1
          id=$(wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="dominomanauara") | .uuid')
          sed -e "s/__D1_ID__/$id/" -e "s/__VERSAO__/diag/" wrangler.template.toml > wrangler.toml
          AGORA=$(($(date +%s) * 1000)); H=3600000; D=86400000
          q() { r=$(wrangler d1 execute dominomanauara --remote --json --command "$2" 2>&1); log "$1: $(echo "$r" | jq -c '.[0].results' 2>/dev/null || echo "$r" | grep -iE 'error|✘' | head -2 | tr '\n' ' ')"; }
          log "diagnóstico $(date -u +%FT%TZ) (horário UTC; Manaus = UTC-4)"
          q "jogaram online (24 h / 7 dias)" "SELECT SUM(visto_em > $AGORA - $D) AS h24, COUNT(*) AS d7 FROM jogadores_vistos WHERE visto_em > $AGORA - 7 * $D"
          q "app aberto agora / nas últimas 24 h" "SELECT SUM(visto_em > $AGORA - 60000) AS agora, SUM(visto_em > $AGORA - $D) AS h24, SUM(visto_em = 0) AS sairam FROM presenca"
          # A presença ("No app agora") só é limpa às 21, 22 e 23 h UTC; desde a última limpeza, todo aparelho que abriu o app
          # tem uma linha nela. Quem entrou numa mesa online desde então sem linha nenhuma jogou sem o app (programa de fora).
          H_UTC=$(date -u +%H); if [ "$H_UTC" -ge 21 ]; then LIMPA=$(date -u -d "today ${H_UTC}:05" +%s); else LIMPA=$(date -u -d "yesterday 23:05" +%s); fi; LIMPA=$((LIMPA * 1000))
          log "janela sem limpeza da presença: desde $(date -u -d @$((LIMPA / 1000)) +%FT%TZ)"
          q "entraram em mesa online na janela / sem o app aberto nenhuma vez" "SELECT COUNT(*) AS entraram, SUM(NOT EXISTS (SELECT 1 FROM presenca p WHERE p.aparelho = v.aparelho)) AS sem_app FROM jogadores_vistos v WHERE v.visto_em > $LIMPA"
          for per in atual anterior; do
            if [ $per = atual ]; then PSQL="(SELECT MAX(periodo) FROM calcada WHERE periodo LIKE 'S%')"; else PSQL="(SELECT MAX(periodo) FROM calcada WHERE periodo LIKE 'S%' AND periodo < (SELECT MAX(periodo) FROM calcada WHERE periodo LIKE 'S%'))"; fi
            q "ranking semana $per" "SELECT periodo, COUNT(*) AS jogadores, SUM(jogadas) AS partidas, MAX(jogadas) AS mais_partidas, SUM(jogadas >= 60) AS com_60_ou_mais, MAX(CASE WHEN jogadas >= 20 THEN ROUND(1.0 * ganhas / jogadas, 2) END) AS maior_aproveitamento_20mais, SUM(jogadas >= 20 AND 1.0 * ganhas / jogadas >= 0.75) AS aproveitamento_75_20mais, SUM(jogadas_gente) AS partidas_com_gente FROM calcada WHERE periodo = $PSQL"
            q "ranking semana $per: 8 maiores números de partidas" "SELECT jogadas, ganhas, jogadas_gente FROM calcada WHERE periodo = $PSQL ORDER BY jogadas DESC LIMIT 8"
          done
          q "contra robôs por dia (7 dias): maior / dias com 40+" "SELECT MAX(n) AS maior, SUM(n >= 40) AS com_40_ou_mais, COUNT(*) AS linhas FROM calcada_robo WHERE dia >= date('now', '-7 day')"
          q "mesma dupla por dia (7 dias): maior / com 20+" "SELECT MAX(n) AS maior, SUM(n >= 20) AS com_20_ou_mais FROM calcada_par WHERE dia >= date('now', '-7 day')"
          q "mesas criadas por endereço por dia (7 dias): maior" "SELECT MAX(c) AS maior, SUM(c >= 20) AS com_20_ou_mais FROM (SELECT marca, COUNT(*) AS c FROM mesas_criadas WHERE criado_em > $AGORA - 7 * $D GROUP BY marca)"
          q "jogaram online por hora do dia (Manaus, 7 dias, pelo último jogo)" "SELECT CAST(((visto_em / $H) - 4 + 24) % 24 AS INTEGER) AS hora, COUNT(*) AS n FROM jogadores_vistos WHERE visto_em > $AGORA - 7 * $D GROUP BY hora ORDER BY hora"
          rm -f wrangler.toml
      - name: Saúde e consumo do Cloudflare (plano grátis)
        working-directory: servidor
        shell: bash
        if: always()
        run: |
          set +e
          ST="$GITHUB_WORKSPACE/diagnostico.txt"
          log() { echo "$*" | tee -a "$ST"; }
          url=https://api.gubfort.workers.dev
          log ""
          log "== saúde agora ($(date -u +%FT%TZ)) =="
          log "saúde: $(curl -s -m 15 -w ' (http %{http_code})' $url/saude)"
          log "mesa online (cria, entra pelo WebSocket e sai): $(timeout 40 node teste_publicado.mjs "$url" 2>&1 | tail -1)"
          log "mesa online, de novo: $(timeout 40 node teste_publicado.mjs "$url" 2>&1 | tail -1)"
          log ""
          log "== consumo por dia (UTC; o dia vira às 20h de Manaus). Limites do plano grátis: Workers 100 mil pedidos/dia; Durable Objects 100 mil pedidos/dia e 13 mil GB-s/dia; D1 5 milhões de linhas lidas e 100 mil escritas/dia =="
          gql() { curl -s -m 30 https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
                    --data "$(jq -n --arg q "$1" --arg acc "$CLOUDFLARE_ACCOUNT_ID" --arg ini "$2" --arg fim "$3" --arg dini "${2%%T*}" --arg dfim "${3%%T*}" '{query:$q, variables:{acc:$acc, ini:$ini, fim:$fim, dini:$dini, dfim:$dfim}}')"; }
          INI=$(date -u -d '6 days ago' +%Y-%m-%dT00:00:00Z); FIM=$(date -u +%FT%TZ)
          r=$(gql 'query($acc: string!, $ini: Time!, $fim: Time!) { viewer { accounts(filter: {accountTag: $acc}) {
              workersInvocationsAdaptive(limit: 500, filter: {datetime_geq: $ini, datetime_leq: $fim}) { sum { requests errors subrequests } dimensions { date status } } } } }' "$INI" "$FIM")
          log "Worker (pedidos por dia e situação): $(echo "$r" | jq -c '(.errors // []) as $e | if ($e|length) > 0 then {erro: [$e[].message]} else [.data.viewer.accounts[0].workersInvocationsAdaptive[] | {d: .dimensions.date, s: .dimensions.status, n: .sum.requests, err: .sum.errors}] | group_by(.d) | map({dia: .[0].d, pedidos: (map(.n) | add), erros: (map(.err) | add), situacoes: (map({(.s): .n}) | add)}) end' 2>/dev/null || echo "$r" | head -c 400)"
          r=$(gql 'query($acc: string!, $ini: Time!, $fim: Time!) { viewer { accounts(filter: {accountTag: $acc}) {
              durableObjectsInvocationsAdaptiveGroups(limit: 500, filter: {datetime_geq: $ini, datetime_leq: $fim}) { sum { requests errors } dimensions { date status } } } } }' "$INI" "$FIM")
          log "Mesas / Durable Objects (pedidos por dia): $(echo "$r" | jq -c '(.errors // []) as $e | if ($e|length) > 0 then {erro: [$e[].message]} else [.data.viewer.accounts[0].durableObjectsInvocationsAdaptiveGroups[] | {d: .dimensions.date, s: .dimensions.status, n: .sum.requests, err: .sum.errors}] | group_by(.d) | map({dia: .[0].d, pedidos: (map(.n) | add), erros: (map(.err) | add), situacoes: (map({(.s): .n}) | add)}) end' 2>/dev/null || echo "$r" | head -c 400)"
          r=$(gql 'query($acc: string!, $ini: Time!, $fim: Time!) { viewer { accounts(filter: {accountTag: $acc}) {
              durableObjectsPeriodicGroups(limit: 500, filter: {datetime_geq: $ini, datetime_leq: $fim}) { sum { activeTime cpuTime exceededCpuErrors exceededMemoryErrors inboundWebsocketMsgCount outboundWebsocketMsgCount storageReadUnits storageWriteUnits } dimensions { date } } } } }' "$INI" "$FIM")
          log "Mesas / Durable Objects (tempo e mensagens por dia): $(echo "$r" | jq -c '(.errors // []) as $e | if ($e|length) > 0 then {erro: [$e[].message]} else [.data.viewer.accounts[0].durableObjectsPeriodicGroups[] | {d: .dimensions.date} + .sum] | group_by(.d) | map({dia: .[0].d, gb_s: ((map(.activeTime) | add) / 1000000 * 0.125 | floor), msgs_entrada: (map(.inboundWebsocketMsgCount) | add), msgs_saida: (map(.outboundWebsocketMsgCount) | add), estouros_cpu: (map(.exceededCpuErrors) | add), estouros_memoria: (map(.exceededMemoryErrors) | add), leituras: (map(.storageReadUnits) | add), escritas: (map(.storageWriteUnits) | add)}) end' 2>/dev/null || echo "$r" | head -c 400)"
          DB=$(npx -y wrangler@4 d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="dominomanauara") | .uuid')
          r=$(curl -s -m 30 https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
                --data "$(jq -n --arg acc "$CLOUDFLARE_ACCOUNT_ID" --arg db "$DB" --arg dini "${INI%%T*}" --arg dfim "${FIM%%T*}" '{query: "query($acc: string!, $db: string!, $dini: Date!, $dfim: Date!) { viewer { accounts(filter: {accountTag: $acc}) { d1AnalyticsAdaptiveGroups(limit: 100, filter: {date_geq: $dini, date_leq: $dfim, databaseId: $db}) { sum { readQueries writeQueries rowsRead rowsWritten } dimensions { date } } } } }", variables: {acc: $acc, db: $db, dini: $dini, dfim: $dfim}}')")
          log "Banco D1 (por dia): $(echo "$r" | jq -c '(.errors // []) as $e | if ($e|length) > 0 then {erro: [$e[].message]} else [.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[] | {dia: .dimensions.date} + .sum] | sort_by(.dia) end' 2>/dev/null || echo "$r" | head -c 400)"
          INI2=$(date -u -d '30 hours ago' +%Y-%m-%dT%H:00:00Z)
          r=$(gql 'query($acc: string!, $ini: Time!, $fim: Time!) { viewer { accounts(filter: {accountTag: $acc}) {
              workersInvocationsAdaptive(limit: 2000, filter: {datetime_geq: $ini, datetime_leq: $fim}) { sum { requests errors } dimensions { datetimeHour status } } } } }' "$INI2" "$FIM")
          log "Worker por hora (últimas 30 h; hora UTC): $(echo "$r" | jq -c '(.errors // []) as $e | if ($e|length) > 0 then {erro: [$e[].message]} else [.data.viewer.accounts[0].workersInvocationsAdaptive[] | {h: .dimensions.datetimeHour[5:13], s: .dimensions.status, n: .sum.requests}] | group_by(.h) | map({h: .[0].h, n: (map(.n) | add), s: (map(select(.s != "success")) | map({(.s): .n}) | add)}) end' 2>/dev/null || echo "$r" | head -c 400)"
      - name: Consumo hora a hora (últimos 4 dias)
        working-directory: servidor
        shell: bash
        if: always()
        run: |
          set +e
          ST="$GITHUB_WORKSPACE/diagnostico.txt"
          log() { echo "$*" | tee -a "$ST"; }
          gq() { curl -s -m 40 https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$1"; }
          INI=$(date -u -d '3 days ago' +%Y-%m-%dT00:00:00Z); FIM=$(date -u +%FT%TZ)
          log ""
          log "== mesas (Durable Objects) hora a hora desde $INI (hora UTC; Manaus = UTC-4): pedidos ok / outros =="
          r=$(gq "$(jq -n --arg acc "$CLOUDFLARE_ACCOUNT_ID" --arg ini "$INI" --arg fim "$FIM" '{query: "query($acc: string!, $ini: Time!, $fim: Time!) { viewer { accounts(filter: {accountTag: $acc}) { durableObjectsInvocationsAdaptiveGroups(limit: 5000, filter: {datetime_geq: $ini, datetime_leq: $fim}) { sum { requests } dimensions { datetimeHour status } } } } }", variables: {acc: $acc, ini: $ini, fim: $fim}}')")
          log "$(echo "$r" | jq -r '(.errors // []) as $e | if ($e|length) > 0 then ([$e[].message] | join("; ")) else [.data.viewer.accounts[0].durableObjectsInvocationsAdaptiveGroups[] | {h: .dimensions.datetimeHour[5:13], ok: (if .dimensions.status == "success" then .sum.requests else 0 end), out: (if .dimensions.status == "success" then 0 else .sum.requests end)}] | group_by(.h) | map("\(.[0].h) \(map(.ok) | add)/\(map(.out) | add)") | join("  ") end' 2>/dev/null || echo "$r" | head -c 300)"
          log "== Worker hora a hora: pedidos ok / outros =="
          r=$(gq "$(jq -n --arg acc "$CLOUDFLARE_ACCOUNT_ID" --arg ini "$INI" --arg fim "$FIM" '{query: "query($acc: string!, $ini: Time!, $fim: Time!) { viewer { accounts(filter: {accountTag: $acc}) { workersInvocationsAdaptive(limit: 5000, filter: {datetime_geq: $ini, datetime_leq: $fim}) { sum { requests } dimensions { datetimeHour status } } } } }", variables: {acc: $acc, ini: $ini, fim: $fim}}')")
          log "$(echo "$r" | jq -r '(.errors // []) as $e | if ($e|length) > 0 then ([$e[].message] | join("; ")) else [.data.viewer.accounts[0].workersInvocationsAdaptive[] | {h: .dimensions.datetimeHour[5:13], ok: (if .dimensions.status == "success" then .sum.requests else 0 end), out: (if .dimensions.status == "success" then 0 else .sum.requests end)}] | group_by(.h) | map("\(.[0].h) \(map(.ok) | add)/\(map(.out) | add)") | join("  ") end' 2>/dev/null || echo "$r" | head -c 300)"
          DB=$(npx -y wrangler@4 d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="dominomanauara") | .uuid')
          log "== banco D1 hora a hora: linhas escritas / consultas de escrita =="
          r=$(gq "$(jq -n --arg acc "$CLOUDFLARE_ACCOUNT_ID" --arg db "$DB" --arg ini "$INI" --arg fim "$FIM" '{query: "query($acc: string!, $db: string!, $ini: Time!, $fim: Time!) { viewer { accounts(filter: {accountTag: $acc}) { d1AnalyticsAdaptiveGroups(limit: 2000, filter: {datetimeHour_geq: $ini, datetimeHour_leq: $fim, databaseId: $db}) { sum { rowsWritten writeQueries } dimensions { datetimeHour } } } } }", variables: {acc: $acc, db: $db, ini: $ini, fim: $fim}}')")
          log "$(echo "$r" | jq -r '(.errors // []) as $e | if ($e|length) > 0 then ([$e[].message] | join("; ")) else [.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[] | "\(.dimensions.datetimeHour[5:13]) \(.sum.rowsWritten)/\(.sum.writeQueries)"] | sort | join("  ") end' 2>/dev/null || echo "$r" | head -c 300)"
      - name: Campos de consumo das mesas (SQLite) e hoje até agora
        working-directory: servidor
        shell: bash
        if: always()
        run: |
          set +e
          ST="$GITHUB_WORKSPACE/diagnostico.txt"
          log() { echo "$*" | tee -a "$ST"; }
          gq() { curl -s -m 40 https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$1"; }
          log ""
          log "== campos que o Cloudflare tem para as mesas (Durable Objects) =="
          for t in AccountDurableObjectsPeriodicGroupsSum AccountDurableObjectsSqlStorageGroupsMax AccountDurableObjectsStorageGroupsMax; do
            r=$(gq "$(jq -n --arg t "$t" '{query: "query($t: String!) { __type(name: $t) { fields { name } } }", variables: {t: $t}}')")
            log "$t: $(echo "$r" | jq -c '[.data.__type.fields[]?.name]' 2>/dev/null)"
          done
          r=$(gq '{"query":"{ __type(name: \"account\") { fields { name } } }"}')
          log "conjuntos com durable: $(echo "$r" | jq -c '[.data.__type.fields[]?.name | select(test("urable"))]' 2>/dev/null)"
          HOJE=$(date -u +%Y-%m-%dT00:00:00Z); FIM=$(date -u +%FT%TZ)
          r=$(gq "$(jq -n --arg acc "$CLOUDFLARE_ACCOUNT_ID" --arg ini "$HOJE" --arg fim "$FIM" '{query: "query($acc: string!, $ini: Time!, $fim: Time!) { viewer { accounts(filter: {accountTag: $acc}) { workersInvocationsAdaptive(limit: 100, filter: {datetime_geq: $ini, datetime_leq: $fim}) { sum { requests } } } } }", variables: {acc: $acc, ini: $ini, fim: $fim}}')")
          log "Worker hoje (desde 00:00 UTC) até $FIM: $(echo "$r" | jq -c '[.data.viewer.accounts[0].workersInvocationsAdaptive[].sum.requests] | add' 2>/dev/null) pedidos (limite 100 mil)"
      - name: Guardar o resultado
        if: always()
        shell: bash
        run: |
          cp diagnostico.txt /tmp/d.txt 2>/dev/null || echo "sem resultado" > /tmp/d.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan dg
          git rm -rfq . > /dev/null 2>&1
          cp /tmp/d.txt diagnostico.txt
          git add diagnostico.txt && git commit -qm "diagnóstico ${GITHUB_SHA::7}" && git push -qf origin HEAD:diagnostico
