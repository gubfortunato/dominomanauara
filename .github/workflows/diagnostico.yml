# Diagnóstico privado: o resultado sai criptografado (só quem tem a chave privada lê). Nada de dado pessoal no log.
name: diagnostico
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c5f546c10d461c0d2e3e1d54f83fba39' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar
        working-directory: servidor
        shell: bash
        run: |
          set +e
          OUT=/tmp/priv.txt; : > $OUT
          cat > /tmp/cf.mjs <<'JS'
          import fs from 'fs';
          const T=process.env.CLOUDFLARE_API_TOKEN, A=process.env.CLOUDFLARE_ACCOUNT_ID, OUT='/tmp/priv.txt';
          const H={authorization:'Bearer '+T,'content-type':'application/json'};
          const put=async(k,v)=>{try{v=await v}catch(e){v={erro:String(e).slice(0,200)}};fs.appendFileSync(OUT,'== '+k+'\n'+JSON.stringify(v).slice(0,400000)+'\n');};
          async function gql(query,variables){const r=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:H,body:JSON.stringify({query,variables})});return r.json();}
          async function api(path,body){const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+A+path,{method:body?'POST':'GET',headers:H,body:body?JSON.stringify(body):undefined});let j;try{j=await r.json()}catch(e){j={status:r.status}};return j;}
          const crypto = await import('crypto');
          const desde=Date.UTC(2026,10,6,12,0), agora=Date.now(), tf={from:desde,to:agora};
          const W='$workers.event.request.headers.', SEM_DO={key:'$workers.executionModel',operation:'neq',type:'string',value:'durableObject'};
          async function q(nome, groupBys, filters, limit){
            const r=await api('/workers/observability/telemetry/query',{queryId:nome,timeframe:tf,view:'calculations',limit:limit||100,
              parameters:{calculations:[{operator:'count'}],groupBys:groupBys.map(v=>({type:'string',value:v})),filters:filters||[],filterCombination:'and'}});
            if(!r.success) return {erro:r.errors};
            const ag=(r.result.calculations&&r.result.calculations[0]&&r.result.calculations[0].aggregates)||[];
            return ag.map(a=>[(a.groups||[]).map(g=>g.value),a.count]).sort((a,b)=>b[1]-a[1]);
          }
          async function q2(nome, groupBys, filters, lim){
            const corpo=(pl)=>({queryId:nome,timeframe:tf,view:'calculations',parameters:Object.assign({calculations:[{operator:'count'}],groupBys:groupBys.map(v=>({type:'string',value:v})),filters:filters||[],filterCombination:'and'},pl)});
            let r=await api('/workers/observability/telemetry/query',corpo({limit:lim||50}));
            if(!r.success) r=await api('/workers/observability/telemetry/query',corpo({}));
            if(!r.success) return {erro:r.errors};
            const ag=(r.result.calculations&&r.result.calculations[0]&&r.result.calculations[0].aggregates)||[];
            return ag.map(a=>[(a.groups||[]).map(g=>g.value),a.count]).sort((a,b)=>b[1]-a[1]);
          }
          const ST='$workers.event.response.status', P='$workers.event.path', UA=W+'user-agent', IP=W+'cf-connecting-ip', ORG='$workers.event.request.cf.asOrganization';
          const g=await gql(`query($a:String!,$f:Time!,$t:Time!){viewer{accounts(filter:{accountTag:$a}){
            w:workersInvocationsAdaptive(limit:50,filter:{datetime_geq:$f,datetime_lt:$t,scriptName:"api"}){sum{requests} quantiles{cpuTimeP50 cpuTimeP99 cpuTimeP999} dimensions{date status usageModel}}
          }}}`,{a:A,f:new Date(Date.now()-3*86400000).toISOString(),t:new Date().toISOString()});
          await put('cpu', g);
          JS
          sed -i 's/^          //' /tmp/cf.mjs
          node /tmp/cf.mjs 2>> $OUT
          cat > /tmp/cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIID/zCCAmegAwIBAgIUQME67vF2YCFx4qbuKp7jtL5uF+AwDQYJKoZIhvcNAQEL
          BQAwDzENMAsGA1UEAwwEZGlhZzAeFw0yNjExMTAxMTIxNDNaFw0yNjEyMTAxMTIx
          NDNaMA8xDTALBgNVBAMMBGRpYWcwggGiMA0GCSqGSIb3DQEBAQUAA4IBjwAwggGK
          AoIBgQCh+a3g8dvenYXkbxbqSEWpc2kIa8M3/sWAEildJeaX+xKJKJEDjkHliJNk
          RLokpedKL8Gm34Q/liKO3cGNZ603gkCzfwoI44FFfhUf5WZtw3vy9WA3T8y+t/Ac
          I+GdzEIL4HCKT7zKB+JAU2DtdLBFTlgJVAuGC0Aw3sfST7VriMYgNpdFRQ63175P
          5zcvwic3Gi7Wz3v3i0Sje3/j/LDtUR3UakrGw6wNOUTzoNd9WjYxJJ7My1DBSMyq
          /GpeOfKzqf15fzS42kDgnPpqxh//Q/01yKZ6IU8Ff2l4HLzUpjl44ysIMc4Xn2S3
          PCRDsbOt37OK1N6OkBM1NjqH/eQTpwllSr6uuvP9XMIMNdEgZtG/DfluHqp941zJ
          xPgMWTTrqfMQ18Nzd0c33CWAZMb7thoGnQuDOqPaBsTENPGXP0xHN+NsgxKVRl/Q
          Lp7qhvGm4tJDjhBywtB0jU5NDLpvtZgnpa0NdlHIZb/vgVOBh1pnGl6NP8DALyF/
          Qp7JhJECAwEAAaNTMFEwHQYDVR0OBBYEFNF4rl7COtkaQ708ieHQ7XqW33gIMB8G
          A1UdIwQYMBaAFNF4rl7COtkaQ708ieHQ7XqW33gIMA8GA1UdEwEB/wQFMAMBAf8w
          DQYJKoZIhvcNAQELBQADggGBAHQa3vjU6BeYLY6b0WP2Vxv/Q83jnLpmkeiobgeE
          /qo8pzZ8jhEo8A3H/khiOZiK7VCcIyqcIFG2vC+3Yhw+tGKeEaGZAfo/29o3hLxD
          5KF+lFSxtkj8ILgj3i51EQ/7YXOLUFsJ2tf0e+zE2Xr4FVVKqQ4dGe1Csdg4XuBh
          oruwNMFqJj6aPT4EXV5TkJLdUD3wjgnlyKNmxcZFzrqkCwhPqKpAIwwZHA5FWgAi
          ywkWWi+sVJW4M+I07nuFYyskSnHyOnLlViAe2WZQdc5oFjVaB/ZSIbvHIa4tCUvP
          tzlALSBZsL2qKclCFJOZrax6IPrakcw6l7qbzVl8ZoHSaqALt6p84eJqbQChv7gu
          wdqKNd6+UINb25CPaNLU+7Ap9tab5W4JlRvaqkMClhq1eiJsxH8FSPGy73thUoAz
          C7NzFY8XbuNHH+E2mO8lIjNg5TRfZtAYkCmo3kc1ygD65DvdVJSQ9eyBjRxiZE2K
          33QifeITDlCjzyrfhrGqS8FUfw==
          -----END CERTIFICATE-----
          CERT
          sed -i 's/^ *//' /tmp/cert.pem
          echo "linhas: $(wc -l < $OUT)"
          openssl cms -encrypt -binary -aes256 -in $OUT -outform PEM -out "$GITHUB_WORKSPACE/diagnostico.txt" /tmp/cert.pem && echo criptografado
          shred -u $OUT 2>/dev/null || rm -f $OUT
      - name: Guardar o resultado
        if: always()
        shell: bash
        run: |
          cp diagnostico.txt /tmp/d.txt 2>/dev/null || echo "sem resultado" > /tmp/d.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan dg
          git rm -rfq . > /dev/null 2>&1
          cp /tmp/d.txt diagnostico.txt
          git add diagnostico.txt && git commit -qm "diagnóstico ${GITHUB_SHA::7}" && git push -qf origin HEAD:diagnostico
