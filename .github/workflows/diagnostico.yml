# Diagnóstico privado: o resultado sai criptografado (só quem tem a chave privada lê). Nada de dado pessoal no log.
name: diagnostico
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c5f546c10d461c0d2e3e1d54f83fba39' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar
        working-directory: servidor
        shell: bash
        run: |
          set +e
          OUT=/tmp/priv.txt; : > $OUT
          npm i -g wrangler@4 > /dev/null 2>&1
          id=$(wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="dominomanauara") | .uuid')
          sed -e "s/__D1_ID__/$id/" -e "s/__VERSAO__/diag/" wrangler.template.toml > wrangler.toml
          AGORA=$(($(date +%s) * 1000)); D=86400000
          p() { echo "== $1" >> $OUT; wrangler d1 execute dominomanauara --remote --json --command "$2" 2>/dev/null | jq -c '.[0].results' >> $OUT 2>/dev/null; }
          NOME="COALESCE((SELECT nome FROM presenca x WHERE x.aparelho = T.aparelho AND x.nome IS NOT NULL), (SELECT nome FROM jogadores_vistos x WHERE x.aparelho = T.aparelho), (SELECT nome FROM ranking x WHERE x.aparelho = T.aparelho ORDER BY atualizado DESC LIMIT 1))"
          p socios "SELECT T.aparelho, T.ate, T.desde, T.codigo, ${NOME//T./T.} AS nome, (SELECT status FROM assinaturas s WHERE s.aparelho = T.aparelho ORDER BY rowid DESC LIMIT 1) AS assinatura FROM planos T ORDER BY T.desde"
          p limites_de_socios "SELECT l.dia, l.aparelho, l.mesas, l.partidas, l.publicas, p.ate, p.desde FROM limites l JOIN planos p ON p.aparelho = l.aparelho WHERE l.dia >= '2026-11-05' AND (l.partidas > 0 OR l.publicas > 0 OR l.mesas > 0)"
          p offline_de_socios "SELECT o.dia, o.aparelho, o.n, p.ate, p.desde FROM offline_uso o JOIN planos p ON p.aparelho = o.aparelho WHERE o.dia >= '2026-11-05'"
          p rede_de_socios "SELECT r.dia, r.tipo, r.aparelho, r.em, p.ate FROM limites_rede r JOIN planos p ON p.aparelho = r.aparelho"
          p desafio_de_socios "SELECT d.dia, d.aparelho, d.n FROM desafio_uso d JOIN planos p ON p.aparelho = d.aparelho"
          p mensagens "SELECT T.id, T.criado_em, T.tipo, T.nome, T.versao, T.aparelho, T.status, substr(T.texto, 1, 300) AS texto, (SELECT ate FROM planos x WHERE x.aparelho = T.aparelho) AS plano_ate FROM mensagens T WHERE T.criado_em > $AGORA - 12 * $D ORDER BY T.criado_em DESC LIMIT 120"
          p pedidos "SELECT T.id, T.aparelho, T.produto, T.valor, T.status, T.criado_em, T.pago_em, (SELECT ate FROM planos x WHERE x.aparelho = T.aparelho) AS plano_ate, ${NOME} AS nome FROM pedidos T WHERE T.criado_em > $AGORA - 20 * $D ORDER BY T.criado_em DESC LIMIT 300"
          p cortesias "SELECT T.aparelho, T.nivel, T.desde, ${NOME} AS nome FROM cortesias T"
          rm -f wrangler.toml
          cat > /tmp/cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIID/zCCAmegAwIBAgIUQME67vF2YCFx4qbuKp7jtL5uF+AwDQYJKoZIhvcNAQEL
          BQAwDzENMAsGA1UEAwwEZGlhZzAeFw0yNjExMTAxMTIxNDNaFw0yNjEyMTAxMTIx
          NDNaMA8xDTALBgNVBAMMBGRpYWcwggGiMA0GCSqGSIb3DQEBAQUAA4IBjwAwggGK
          AoIBgQCh+a3g8dvenYXkbxbqSEWpc2kIa8M3/sWAEildJeaX+xKJKJEDjkHliJNk
          RLokpedKL8Gm34Q/liKO3cGNZ603gkCzfwoI44FFfhUf5WZtw3vy9WA3T8y+t/Ac
          I+GdzEIL4HCKT7zKB+JAU2DtdLBFTlgJVAuGC0Aw3sfST7VriMYgNpdFRQ63175P
          5zcvwic3Gi7Wz3v3i0Sje3/j/LDtUR3UakrGw6wNOUTzoNd9WjYxJJ7My1DBSMyq
          /GpeOfKzqf15fzS42kDgnPpqxh//Q/01yKZ6IU8Ff2l4HLzUpjl44ysIMc4Xn2S3
          PCRDsbOt37OK1N6OkBM1NjqH/eQTpwllSr6uuvP9XMIMNdEgZtG/DfluHqp941zJ
          xPgMWTTrqfMQ18Nzd0c33CWAZMb7thoGnQuDOqPaBsTENPGXP0xHN+NsgxKVRl/Q
