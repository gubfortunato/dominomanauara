# Publica o servidor do Dominó Manauara no Cloudflare (Workers + D1) sempre que a pasta servidor/ muda.
# O resultado vai para o ramo "servidor-status" (status.txt), sem nenhum segredo.
name: servidor
on:
  push:
    branches: [main]
    paths: ['servidor/**', '.github/workflows/servidor.yml']
permissions:
  contents: write
concurrency:
  group: servidor
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # O Account ID não é senha (aparece no endereço do painel); o token continua só nos segredos do GitHub.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c5f546c10d461c0d2e3e1d54f83fba39' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar
        working-directory: servidor
        shell: bash
        run: |
          set +e
          ST="$GITHUB_WORKSPACE/status.txt"; : > "$ST"
          log() { echo "$*" | tee -a "$ST"; }
          log "commit ${GITHUB_SHA::7} · $(date -u +%FT%TZ)"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            log "ERRO: faltam os segredos CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID no GitHub"; exit 0
          fi
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          log "token (usuário): $(curl -s -H "$H" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{ok: .success, status: .result.status}')"
          log "token (conta): $(curl -s -H "$H" "$API/tokens/verify" | jq -c '{ok: .success, status: .result.status}')"
          # Endereço *.workers.dev da conta
          sub=$(curl -s -H "$H" "$API/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            for nome in dominomanauara dominomanauara-jogo dmanauara-jogo; do
              r=$(curl -s -X PUT -H "$H" -H 'content-type: application/json' --data "{\"subdomain\":\"$nome\"}" "$API/workers/subdomain")
              if [ "$(echo "$r" | jq -r .success)" = "true" ]; then sub=$nome; break; fi
              log "subdomínio $nome: $(echo "$r" | jq -c '.errors')"
            done
          fi
          log "subdomínio: ${sub:-NENHUM}"
          npm i -g wrangler@4 > /dev/null 2>&1; log "wrangler: $(wrangler --version 2>&1 | tail -1)"
          # Banco D1
          id=$(wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="dominomanauara") | .uuid')
          if [ -z "$id" ]; then
            out=$(wrangler d1 create dominomanauara 2>&1); log "criar banco: $(echo "$out" | grep -iE 'success|error|✘|created' | head -3 | tr '\n' ' ')"
            id=$(wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="dominomanauara") | .uuid')
          fi
          log "banco: ${id:-NENHUM}"
          sed "s/__D1_ID__/$id/" wrangler.template.toml > wrangler.toml
          out=$(wrangler d1 execute dominomanauara --remote --file=schema.sql 2>&1); rc=$?
          log "tabelas: código $rc $(echo "$out" | grep -iE 'success|error|✘|executed' | head -3 | tr '\n' ' ')"
          out=$(wrangler deploy 2>&1); rc=$?
          log "publicar: código $rc"
          echo "$out" | grep -E 'https://|Error|error|✘|Uploaded|Deployed' | head -10 | tee -a "$ST"
          # Chaves dos lembretes (VAPID): criadas uma vez e guardadas só no Cloudflare, como segredo do Worker
          if [ "$rc" = "0" ] && ! wrangler secret list 2>/dev/null | grep -q VAPID_PRIVATE_JWK; then
            node -e "const c=require('crypto');const k=c.generateKeyPairSync('ec',{namedCurve:'prime256v1'});process.stdout.write(JSON.stringify({jwk:k.privateKey.export({format:'jwk'}),pub:k.publicKey.export({format:'der',type:'spki'}).subarray(-65).toString('base64url')}))" > /tmp/v.json
            jq -c .jwk /tmp/v.json | wrangler secret put VAPID_PRIVATE_JWK > /dev/null 2>&1; r1=$?
            jq -r .pub /tmp/v.json | tr -d '\n' | wrangler secret put VAPID_PUBLIC > /dev/null 2>&1; r2=$?
            rm -f /tmp/v.json
            log "chaves dos lembretes: criadas agora (códigos $r1 $r2)"
          else
            log "chaves dos lembretes: $(wrangler secret list 2>/dev/null | grep -c VAPID) segredos já guardados"
          fi
          url="https://api.$sub.workers.dev"
          for i in 1 2 3 4 5 6; do s=$(curl -s "$url/saude"); [ -n "$s" ] && break; sleep 5; done
          log "saúde: $s"
          log "mensagem de teste: $(curl -s -X POST -H 'content-type: application/json' --data '{"tipo":"outro","texto":"Teste automático: a caixa de mensagens está funcionando.","nome":"Servidor"}' "$url/mensagens")"
          log "lembretes: $(curl -s "$url/avisos/chave" | jq -c '{chave_publica: (.chave != null)}')"
          log "url: $url"
      - name: Guardar o resultado
        if: always()
        shell: bash
        run: |
          cp status.txt /tmp/status.txt 2>/dev/null || echo "sem status (o passo anterior nem começou)" > /tmp/status.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan st
          git rm -rfq . > /dev/null 2>&1
          cp /tmp/status.txt status.txt
          git add status.txt && git commit -qm "status do servidor ${GITHUB_SHA::7}" && git push -qf origin HEAD:servidor-status
