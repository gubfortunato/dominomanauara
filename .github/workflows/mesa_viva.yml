# 28/10: teste rápido da mesa online publicada (cria uma mesa, entra pelo WebSocket e sai). Só o resultado, sem dados de ninguém.
name: mesa_viva
on:
  workflow_dispatch:
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: servidor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mesa online
        run: |
          cd servidor
          r=$(timeout 40 node teste_publicado.mjs https://api.gubfort.workers.dev 2>&1 | tail -1)
          echo "::notice title=mesa online::$r"
          v=$(curl -s -m 20 -H 'origin: https://dominomanauara.com.br' https://api.gubfort.workers.dev/vivo/mesas | jq -c '{mesas: (.mesas | length), conectados: ([.mesas[].on] | add // 0)}' 2>&1)
          f=$(curl -s -m 20 -H 'origin: https://dominomanauara.com.br' https://api.gubfort.workers.dev/mesa/rapida/status 2>&1 | head -c 200)
          echo "::notice title=lista ao vivo (só contagens)::$v · mesa rápida: $f"
          t=$(curl -s -m 20 -H 'origin: https://dominomanauara.com.br' https://api.gubfort.workers.dev/vivo/mesas | jq -c '[.mesas[] | (.tema // "sem-tema")] | group_by(.) | map({(.[0]): length}) | add' 2>&1)
          echo "::notice title=desenho das mesas ao vivo (contagem)::$t"
          echo "RESULTADO: $r" >> "$GITHUB_STEP_SUMMARY"
