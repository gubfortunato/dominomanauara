# Gerado pelo GitHub Actions: o ID do banco entra na hora de publicar.
name = "api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Resumo (SHA-256) da chave do dono. A chave em si nunca fica aqui.
ADMIN_HASH = "e57e78a3bb0d8127b02226822dbc4fe943bb5ddd711696f032bcf36adf28589c"

# Lembretes para jogar: 17h, 18h e 19h em Manaus (21h, 22h e 23h UTC)
[triggers]
crons = ["0 21,22,23 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "dominomanauara"
database_id = "__D1_ID__"

# Mesa online: cada mesa é um Durable Object (com SQLite, disponível no plano grátis)
[[durable_objects.bindings]]
name = "MESA"
class_name = "Mesa"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mesa"]
